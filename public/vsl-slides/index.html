<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VSL №1 — слайды · Роман Прокопов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ГЕОМЕТРИЯ КАДРА: слева камера эксперта, справа презентация */
  --frame-w:1920px;    /* весь кадр */
  --expert-w:640px;    /* левая колонка под вертикальное видео эксперта */
  --slide-w:1280px;    /* правая колонка — презентация */
  --slide-h:1080px;
  --pad:72px;          /* безопасные поля */
  --subzone:90px;      /* нижняя зона субтитров */
  --rightres:40px;     /* правый запас на обрезку */

  /* ПАЛИТРА — из /prezentaciya-ai-konveyer */
  --bg:#060608; --bg-soft:#0a0a10; --bg-card:#0d0d12; --bg-card-hover:#14141c;
  --accent:#e8921a; --accent-deep:#c77010; --accent-gold:#e9b646; --accent-light:#f5b34a;
  --accent-glow:rgba(232,146,26,.25); --accent-glow-strong:rgba(232,146,26,.45);
  --text:#f2ede3; --text-muted:#a9a396; --text-dim:#6b665d;
  --border:#1e1e2a; --border-strong:#2a2a36;
  --border-accent:rgba(232,146,26,.32); --border-accent-strong:rgba(232,146,26,.55);
  --danger:#ff5c5c;
  --radius-sm:14px; --radius-md:18px; --radius-lg:24px;
  --shadow-card:0 18px 40px rgba(0,0,0,.45);
  --shadow-glow:0 0 50px var(--accent-glow),0 0 100px rgba(232,146,26,.08);
  --font-display:'Tektur',sans-serif;
  --font-body:'Manrope',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;min-width:0;}
html,body{height:100%;overflow:hidden;background:#000;}
img,svg{max-width:100%;display:block;}
body{font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;}
::selection{background:var(--accent);color:#000;}

/* ===== СЦЕНА · кадр 1920×1080 целиком масштабируется под окно ===== */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;}
.frame{
  position:relative;flex:0 0 auto;display:flex;
  width:var(--frame-w);height:var(--slide-h);
  transform-origin:center center;
}
/* левая колонка — сюда монтажёр кладёт вертикальное видео эксперта */
.expert{position:relative;flex:0 0 auto;width:var(--expert-w);height:100%;background:#000;}
.expert .ez{
  position:absolute;inset:24px;border:2px dashed rgba(232,146,26,.32);border-radius:22px;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
}
body.ui .expert .ez{display:flex;}
.expert .ez b{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--accent-light);}
.expert .ez span{font-size:24px;color:var(--text-dim);}
/* режим «только презентация» — левая колонка убирается, кадр становится 1280×1080 */
body.solo .expert{display:none;}
body.solo .frame{width:var(--slide-w);}
.canvas{
  position:relative;flex:0 0 auto;
  width:var(--slide-w);height:var(--slide-h);
  background:var(--bg);overflow:hidden;
}
/* зерно */
.canvas::after{
  content:'';position:absolute;inset:0;z-index:60;pointer-events:none;opacity:.4;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

/* ===== СЛАЙД ===== */
.slide{
  position:absolute;inset:0;
  padding:var(--pad) calc(var(--pad) + var(--rightres)) calc(var(--pad) + var(--subzone)) var(--pad);
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;
  /* уходящий гаснет быстро, приходящий проявляется с небольшой задержкой:
     ~200 мс на переход и почти без наложения двух слайдов */
  transition:opacity .08s ease,visibility 0s linear .08s;
  overflow:hidden;
}
.slide.active{opacity:1;visibility:visible;z-index:2;transition:opacity .14s ease .06s,visibility 0s;}
.inner{width:100%;transform-origin:center center;}
.slide.center{text-align:center;}
.slide.center .inner{max-width:1000px;margin:0 auto;}
/* свечение на титульных */
.slide.glow::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(58% 50% at 50% 44%,var(--accent-glow) 0%,rgba(232,146,26,.06) 42%,transparent 72%);
}
.slide.glow .inner{position:relative;z-index:1;}

/* ===== ТИПОГРАФИКА (шкала под 1280×1080) ===== */
.eyebrow{
  display:block;margin-bottom:20px;
  font-family:var(--font-display);font-size:26px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
}
h1{font-family:var(--font-display);font-weight:800;font-size:104px;line-height:1.05;letter-spacing:-1.5px;}
h2{font-family:var(--font-display);font-weight:700;font-size:72px;line-height:1.1;letter-spacing:-.5px;}
h2.sm{font-size:64px;}
.lead{font-size:40px;font-weight:400;line-height:1.35;color:var(--text-muted);margin-top:28px;}
.lead strong{color:var(--accent-light);font-weight:700;}
h1 strong,h2 strong{color:var(--accent-light);font-weight:inherit;}
.note{margin-top:30px;font-size:28px;line-height:1.4;color:var(--text-muted);}
.note strong{color:var(--accent-light);font-weight:700;}
strong{color:var(--accent-light);font-weight:700;}

/* ===== СПИСОК ПУНКТОВ ===== */
.bullets{list-style:none;margin-top:40px;}
.bullets li{position:relative;padding:16px 0 16px 52px;font-size:34px;font-weight:400;line-height:1.35;border-bottom:1px solid var(--border);}
.bullets li:last-child{border-bottom:none;}
.bullets li::before{content:'✦';position:absolute;left:6px;top:16px;color:var(--accent);font-size:30px;}
.bullets.num{counter-reset:b;}
.bullets.num li::before{
  counter-increment:b;content:counter(b);left:0;top:14px;
  font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--accent);
}
.bullets.compact li{padding:12px 0 12px 48px;font-size:30px;line-height:1.32;}
.bullets.compact li::before{top:12px;font-size:27px;}
.bullets.quotes li{font-style:italic;}

/* ===== ЦИФРЫ ===== */
.stats{display:grid;gap:20px;margin-top:44px;}
.stats.n2{grid-template-columns:repeat(2,1fr);}
.stats.n3{grid-template-columns:repeat(3,1fr);}
.stats.n4{grid-template-columns:repeat(4,1fr);}
.stats .cell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 22px;text-align:center;display:flex;flex-direction:column;justify-content:center;}
.stats .n{
  font-family:var(--font-display);font-weight:800;font-size:132px;line-height:.92;letter-spacing:-2px;white-space:nowrap;
  background:linear-gradient(180deg,var(--accent-light) 0%,var(--accent) 55%,var(--accent-deep) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.stats .u{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--accent-light);margin-top:2px;}
.stats .l{margin-top:14px;font-size:26px;font-weight:500;line-height:1.3;color:var(--text-muted);}
/* инлайн-строка цифр для кейсов */
.statline{display:flex;gap:18px;margin-top:28px;}
.statline .c{flex:1 1 0;background:var(--bg-card);border:1px solid var(--border-accent);border-radius:var(--radius-md);padding:16px 14px;text-align:center;display:flex;flex-direction:column;justify-content:center;}
.statline .n{font-family:var(--font-display);font-weight:800;font-size:52px;line-height:1;color:var(--accent-light);white-space:nowrap;}
.statline .l{margin-top:8px;font-size:24px;color:var(--text-muted);line-height:1.25;}

/* ===== ЦЕПОЧКА · номера-жетоны на общей линии ===== */
.chain{position:relative;display:grid;gap:14px;margin-top:38px;padding-left:76px;}
.chain::before{
  content:'';position:absolute;left:29px;top:34px;bottom:34px;width:2px;
  background:linear-gradient(180deg,transparent,var(--border-accent-strong) 10%,var(--border-accent-strong) 90%,transparent);
}
.chain .ci{
  position:relative;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:18px 28px;
}
.chain .cn{
  position:absolute;left:-76px;top:50%;transform:translateY(-50%);
  width:60px;height:60px;border-radius:50%;
  background:var(--bg-card);border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--accent-light);
  box-shadow:0 0 24px var(--accent-glow);
}
.chain .ct{font-size:34px;line-height:1.3;}
.chain.compact{gap:12px;padding-left:70px;}
.chain.compact::before{left:26px;}
.chain.compact .ci{padding:13px 24px;}
.chain.compact .cn{left:-70px;width:54px;height:54px;font-size:24px;box-shadow:0 0 20px var(--accent-glow);}
.chain.compact .ct{font-size:30px;line-height:1.25;}

/* ===== СХЕМА · слои системы: поверхность / фундамент / глубина ===== */
.scheme{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-top:18px;width:100%;}
.scheme .lyr{width:100%;}
.scheme .cap{
  margin-top:6px;text-align:center;
  font-family:var(--font-display);font-weight:700;font-size:24px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
}
.scheme .lyr.dim .cap{color:var(--text-dim);}
.scheme .up{text-align:center;color:var(--accent);font-size:26px;line-height:1;}
.scheme .down{text-align:center;color:var(--accent);font-size:26px;line-height:1;}

/* верхний слой — цикл: рамка-петля с возвратом в первый узел */
.scheme .box.loop{
  position:relative;border:2px solid var(--accent);border-radius:26px;
  padding:28px 18px 16px 46px;
  background:linear-gradient(160deg,rgba(232,146,26,.05),transparent);
  box-shadow:0 0 44px rgba(232,146,26,.10);
  display:grid;gap:8px;
}
.scheme .box.loop::after{
  content:'';position:absolute;left:16px;top:calc(50% + 7px);transform:translateY(-50%);
  border-left:13px solid var(--accent);border-top:9px solid transparent;border-bottom:9px solid transparent;
}
.scheme .flow{display:flex;align-items:stretch;justify-content:center;gap:7px;flex-wrap:nowrap;}
.scheme .ar{display:flex;align-items:center;color:var(--accent);font-size:26px;font-style:normal;flex:0 0 auto;}
.scheme .nd{
  flex:0 0 auto;
  background:var(--bg-card);border:1px solid #39394a;border-radius:14px;
  padding:13px 12px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:26px;font-weight:700;line-height:1.15;
}
.scheme .nd.acc{border-color:var(--border-accent-strong);color:var(--accent-light);}

/* нижние слои — плоские контейнеры */
.scheme .box.flat{
  border:1px solid var(--border-strong);border-radius:24px;padding:14px 16px;
  background:rgba(255,255,255,.015);
}
.scheme .cols{display:flex;align-items:stretch;gap:12px;}
.scheme .cols .nd2{
  flex:1 1 0;text-align:center;font-size:28px;font-weight:600;color:var(--text);
  padding:12px 10px;border-left:3px solid var(--border-accent);border-radius:10px;
  background:rgba(255,255,255,.02);
  display:flex;align-items:center;justify-content:center;
}
.scheme .lyr.narrow{display:flex;flex-direction:column;align-items:center;}
.scheme .lyr.narrow .box{width:auto;}
.scheme .pair{display:flex;align-items:center;justify-content:center;gap:16px;}
.scheme .pair .nd3{
  font-size:28px;font-weight:600;color:var(--text-muted);
  padding:11px 20px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02);
}
.scheme .plus{color:var(--accent);font-family:var(--font-display);font-weight:800;font-size:30px;}

/* ===== СРАВНЕНИЕ ===== */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:42px;align-items:stretch;}
.compare .col{border-radius:var(--radius-lg);padding:34px 30px;border:1px solid var(--border);display:flex;flex-direction:column;}
.compare .col h4{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1.1;margin-bottom:22px;}
.compare .col ul{list-style:none;}
.compare .col li{position:relative;padding:13px 0 13px 40px;font-size:30px;line-height:1.35;border-bottom:1px solid rgba(255,255,255,.05);}
.compare .col li:last-child{border-bottom:none;}
.compare .col li::before{position:absolute;left:0;top:13px;font-size:26px;}
.compare .col p{font-size:32px;line-height:1.35;color:var(--text-muted);}
.compare .big{font-family:var(--font-display);font-weight:800;font-size:118px;line-height:1;letter-spacing:-2px;margin-bottom:12px;white-space:nowrap;}
/* обе колонки — только крупная цифра: центрируем и добавляем воздуха */
.compare.num .col{text-align:center;justify-content:center;padding:52px 30px;}
.compare .bigsub{font-size:30px;line-height:1.3;color:var(--text-muted);}
.compare .col-bad{background:linear-gradient(160deg,rgba(255,92,92,.05),transparent);border-color:rgba(255,92,92,.24);}
.compare .col-bad h4,.compare .col-bad .big{color:#ff8f8f;}
.compare .col-bad li::before{content:'✕';color:var(--danger);}
.compare .col-good{background:linear-gradient(160deg,rgba(232,146,26,.09),transparent);border-color:var(--border-accent-strong);box-shadow:var(--shadow-glow);}
.compare .col-good h4,.compare .col-good .big{color:var(--accent-light);}
.compare .col-good li::before{content:'✦';color:var(--accent);}
.compare .col-good p{color:var(--text);}

/* ===== ТАБЛИЦА ===== */
.tbl{width:100%;border-collapse:collapse;margin-top:38px;table-layout:fixed;}
.tbl th:nth-child(1){width:30%;} .tbl th:nth-child(2){width:32%;}
.tbl th{
  font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);text-align:left;padding:0 20px 16px;border-bottom:2px solid var(--border-accent);
}
.tbl td{font-size:30px;line-height:1.25;padding:17px 20px;border-bottom:1px solid var(--border);}
.tbl td:first-child{font-weight:600;}
.tbl td.was{color:var(--text-muted);}
.tbl td.now{color:var(--accent-light);font-weight:700;}
.tbl tr:last-child td{border-bottom:none;}

/* ===== ЦИТАТЫ ===== */
.quotes-list{display:grid;gap:22px;margin-top:44px;}
.quotes-list .q{
  position:relative;background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--radius-md);padding:26px 30px 26px 78px;
  font-size:38px;line-height:1.28;font-style:italic;
}
.quotes-list .q::before{content:'“';position:absolute;left:24px;top:24px;font-family:var(--font-display);font-size:76px;line-height:.7;color:var(--accent);}

/* ===== СКРИНШОТЫ ===== */
.shots{display:grid;gap:22px;margin-top:34px;align-items:start;}
.shots.k1{grid-template-columns:1fr;}
.shots.k2{grid-template-columns:1fr 1fr;}
.shots.k3{grid-template-columns:repeat(3,1fr);}
.shot{
  background:linear-gradient(158deg,#181820,#0b0b11);
  border:1px solid var(--border-accent);border-radius:20px;padding:8px;
  box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 34px rgba(232,146,26,.10);
  display:flex;flex-direction:column;justify-self:center;max-width:100%;
}
/* высоту и ширину под пропорцию картинки проставляет fitShots(), чтобы
   рамка облегала скриншот, а не висела вокруг него пустыми полями */
.shot img{width:100%;height:var(--sh,360px);object-fit:contain;border-radius:13px;background:#0a0a10;}
.shot .cap{font-size:24px;line-height:1.25;color:var(--text-muted);text-align:center;padding:12px 6px 4px;}
.shot .ph{
  width:100%;height:var(--sh,360px);border-radius:13px;background:repeating-linear-gradient(45deg,#101018,#101018 14px,#0c0c12 14px,#0c0c12 28px);
  border:2px dashed var(--border-accent-strong);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;
}
.shot .ph .pi{font-size:44px;}
.shot .ph .pf{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--accent-light);word-break:break-all;}
.shot .ph .pt{font-size:24px;color:var(--text-dim);}

/* ===== КАРУСЕЛЬ · листается стрелками и точками ===== */
.carou{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:24px;}
.carou-row{display:flex;align-items:center;gap:24px;}
.carou-stage{
  background:linear-gradient(158deg,#181820,#0b0b11);
  border:1px solid var(--border-accent);border-radius:20px;padding:8px;
  box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 34px rgba(232,146,26,.10);
}
.carou-stage img{display:block;height:var(--ch,470px);width:auto;border-radius:13px;background:#0a0a10;}
.carou-btn{
  flex:0 0 auto;width:66px;height:66px;border-radius:50%;
  border:1px solid var(--border-accent-strong);background:rgba(13,13,18,.85);
  color:var(--accent-light);font-size:36px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.carou-btn:hover{background:rgba(232,146,26,.14);box-shadow:0 0 22px var(--accent-glow);}
.carou-btn:active{transform:scale(.93);}
.carou-nav{display:flex;align-items:center;gap:18px;}
.carou-dots{display:flex;gap:11px;align-items:center;}
.carou-dots i{width:12px;height:12px;border-radius:50%;background:var(--border-strong);cursor:pointer;transition:.2s;}
.carou-dots i.on{background:var(--accent);box-shadow:0 0 12px var(--accent);transform:scale(1.35);}
.carou-count{font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--text-muted);white-space:nowrap;}

/* ===== ЛУПА · наведение на скриншот показывает его крупно =====
   Служебная вещь для просмотра в браузере: появляется только под курсором,
   в записи её не будет — просто не наводи мышь на скриншот. */
.shot img,.carou-stage img{cursor:zoom-in;transition:transform .2s,box-shadow .2s;}
.shot img:hover,.carou-stage img:hover{transform:translateY(-3px);}
.zoomview{
  position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,8,.86);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s;pointer-events:none;
}
.zoomview.on{opacity:1;visibility:visible;}
.zoomview.pinned{pointer-events:auto;cursor:zoom-out;}
.zoomview img{
  max-width:86vw;max-height:86vh;width:auto;height:auto;border-radius:14px;
  border:1px solid var(--border-accent);box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 46px var(--accent-glow);
  transform:scale(.94);opacity:0;transition:transform .22s cubic-bezier(.34,1.4,.5,1),opacity .16s;
}
.zoomview.on img{transform:scale(1);opacity:1;}
.zoomview .zhint{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:1px;color:var(--text-dim);
  background:rgba(13,13,18,.85);border:1px solid var(--border-strong);padding:8px 18px;border-radius:30px;
}

/* ===== ФИНАЛ ===== */
.final-steps{display:grid;gap:16px;margin-top:40px;counter-reset:f;text-align:left;}
.final-steps .fs{
  display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 28px;
}
.final-steps .fs .fn{font-family:var(--font-display);font-weight:800;font-size:38px;color:transparent;-webkit-text-stroke:2px var(--accent);line-height:1;min-width:36px;}
.final-steps .fs .ft{font-size:32px;line-height:1.3;}
.cta{

.fx{overflow:hidden;}
.fx .inner{position:relative;z-index:3;}
.fxbg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.fxbg .base{position:absolute;inset:0;
  background:radial-gradient(65% 60% at 18% 28%,rgba(232,146,26,.20),transparent 62%),
             radial-gradient(55% 55% at 88% 82%,rgba(233,182,70,.14),transparent 60%);}
.fxbg .grid{position:absolute;inset:-2px;
  background-image:linear-gradient(rgba(232,146,26,.07) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(232,146,26,.07) 1px,transparent 1px);
  background-size:58px 58px;
  -webkit-mask-image:radial-gradient(72% 72% at 45% 42%,#000,transparent 82%);
  mask-image:radial-gradient(72% 72% at 45% 42%,#000,transparent 82%);}
.fxbg .emblem{position:absolute;right:-150px;top:8%;width:560px;height:560px;border-radius:50%;
  background:conic-gradient(from 30deg,transparent 0deg,rgba(232,146,26,.15) 40deg,transparent 120deg,rgba(233,182,70,.11) 200deg,transparent 300deg);
  -webkit-mask:radial-gradient(circle,transparent 54%,#000 55%,#000 71%,transparent 72%);
  mask:radial-gradient(circle,transparent 54%,#000 55%,#000 71%,transparent 72%);opacity:.9;}
.fxbg .emblem.two{width:360px;height:360px;right:-40px;top:26%;opacity:.7;transform:rotate(140deg);}
.fxbg .orb{position:absolute;border-radius:50%;filter:blur(64px);mix-blend-mode:screen;opacity:.5;}
.fxbg .orb.o1{width:440px;height:440px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-90px;left:-70px;}
.fxbg .orb.o2{width:380px;height:380px;background:radial-gradient(circle,var(--accent-gold),transparent 70%);bottom:-120px;right:-50px;}
.fxbg .orb.o3{width:300px;height:300px;background:radial-gradient(circle,var(--accent-deep),transparent 70%);top:44%;left:52%;}
.fxbg .ln{position:absolute;height:1.5px;width:38%;
  background:linear-gradient(90deg,transparent,var(--accent-light),transparent);
  filter:drop-shadow(0 0 6px var(--accent));opacity:.38;}
.fxbg .ln.a{top:20%;left:-6%;} .fxbg .ln.b{top:53%;left:44%;opacity:.24;} .fxbg .ln.c{top:81%;left:10%;}

.fx.v2 .base{background:radial-gradient(60% 60% at 84% 26%,rgba(232,146,26,.20),transparent 62%),

.fx.v2 .emblem{right:auto;left:-150px;} .fx.v2 .emblem.two{right:auto;left:-40px;}
.fx.v3 .base{background:radial-gradient(72% 66% at 50% 14%,rgba(232,146,26,.19),transparent 66%);}
.fx.v3 .emblem{right:-180px;top:-12%;} .fx.v3 .emblem.two{left:-60px;right:auto;top:auto;bottom:-6%;}

/* ============================================================
   РЕНДЕР
   ============================================================ */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md  = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

const eyebrow = d => d.eyebrow ? `<div class="eyebrow">${md(d.eyebrow)}</div>` : '';
const title   = (d,tag='h2') => d.title ? `<${tag}>${md(d.title)}</${tag}>` : '';
const lead    = d => d.lead ? `<p class="lead">${md(d.lead)}</p>` : '';
const note    = d => d.note ? `<p class="note">${md(d.note)}</p>` : '';

function shotHTML(sh, h){
  const file = sh.src.split('/').pop();
  return `<figure class="shot" style="--sh:${h}px">
    <img src="${sh.src}" alt="${esc(sh.cap||'')}" data-file="${file}">
    ${sh.cap?`<figcaption class="cap">${md(sh.cap)}</figcaption>`:''}
  </figure>`;
}

const RENDER = {
  title(d){
    return `<div class="inner">${eyebrow(d)}<h1>${md(d.title)}</h1>${lead(d)}</div>`;
  },
  statement(d){
    return `<div class="inner">${eyebrow(d)}${title(d)}${lead(d)}${note(d)}</div>`;
  },
  bullets(d){
    const cls = ['bullets'];
    if(d.numbered) cls.push('num');
    if(d.quotes) cls.push('quotes');
    if(d.items.length >= 5) cls.push('compact');
    const li = d.items.map(t=>`<li>${md(t)}</li>`).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}${lead(d)}<ul class="${cls.join(' ')}">${li}</ul>${note(d)}</div>`;
  },
  stats(d){
    /* если хоть у одной цифры есть единица — строку резервируем во всех, чтобы подписи шли по одной линии */
    const anyU = d.stats.some(s=>s.u);
    const cells = d.stats.map(s=>`<div class="cell">
      <div class="n">${md(s.n)}</div>
      ${anyU?`<div class="u">${s.u?md(s.u):'&nbsp;'}</div>`:''}
      <div class="l">${md(s.l)}</div>
    </div>`).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}${lead(d)}
      <div class="stats n${d.stats.length}">${cells}</div>${note(d)}</div>`;
  },
  chain(d){
    const compact = d.items.length >= 5 ? ' compact' : '';
    const items = d.items.map((t,i)=>`<div class="ci"><div class="cn">${String(i+1).padStart(2,'0')}</div><div class="ct">${md(t)}</div></div>`).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}<div class="chain${compact}">${items}</div>${note(d)}</div>`;
  },
  compare(d){
    const col = (c,kind)=>{
      let body = '';
      if(c.big) body += `<div class="big">${md(c.big)}</div><div class="bigsub">${md(c.sub||'')}</div>`;
      if(c.text) body += `<p>${md(c.text)}</p>`;
      if(c.items) body += `<ul>${c.items.map(t=>`<li>${md(t)}</li>`).join('')}</ul>`;
      return `<div class="col col-${kind}">${c.title?`<h4>${md(c.title)}</h4>`:''}${body}</div>`;
    };
    const onlyBig = c => c.big && !c.items && !c.text;
    const num = onlyBig(d.left) && onlyBig(d.right) ? ' num' : '';
    return `<div class="inner">${eyebrow(d)}${title(d)}
      <div class="compare${num}">${col(d.left,'bad')}${col(d.right,'good')}</div>${note(d)}</div>`;
  },
  scheme(d){
    /* три вида слоя: cycle — узлы со стрелками в рамке-петле,
       cols — равные колонки, pair — два узла через «+» */
    const layer = L => {
      const it = x => (typeof x === 'string') ? {t:x} : x;
      let body, boxCls, lyrCls = L.kind==='cycle' ? '' : ' dim';
      if(L.kind === 'cycle'){
        boxCls = 'box loop';
        const nd = x => {
          const o = it(x);
          return `<div class="nd${o.acc?' acc':''}"><span>${md(o.t)}</span></div>`;
        };
        /* rows — сколько узлов в каждой строке: в 1280 весь цикл в одну строку
           не влезает без падения кегля ниже читаемого */
        const plan = L.rows || [L.items.length];
        let k = 0;
        body = plan.map(n=>{
          const chunk = L.items.slice(k, k+n); k += n;
          return '<div class="flow">' + chunk.map(nd).join('<i class="ar">→</i>') + '</div>';
        }).join('<div class="down">↓</div>');
      } else if(L.kind === 'pair'){
        boxCls = 'box flat'; lyrCls += ' narrow';
        body = '<div class="pair">' + L.items.map(x=>`<div class="nd3">${md(it(x).t)}</div>`).join('<i class="plus">+</i>') + '</div>';
      } else {
        boxCls = 'box flat';
        body = '<div class="cols">' + L.items.map(x=>`<div class="nd2">${md(it(x).t)}</div>`).join('') + '</div>';
      }
      return `<div class="lyr${lyrCls}">
        <div class="${boxCls}">${body}</div>
        ${L.cap?`<div class="cap">${md(L.cap)}</div>`:''}
      </div>`;
    };
    const body = d.layers.map(layer).join('<div class="up">↑</div>');
    return `<div class="inner">${eyebrow(d)}${title(d)}<div class="scheme">${body}</div>${note(d)}</div>`;
  },
  table(d){
    const th = d.head.map(h=>`<th>${md(h)}</th>`).join('');
    const tr = d.rows.map(r=>`<tr><td>${md(r[0])}</td><td class="was">${md(r[1])}</td><td class="now">${md(r[2])}</td></tr>`).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}
      <table class="tbl"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>${note(d)}</div>`;
  },
  quote(d){
    const q = d.items.map(t=>`<div class="q">${md(t)}</div>`).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}<div class="quotes-list">${q}</div>${note(d)}</div>`;
  },
  carousel(d){
    const h = d.carouH || 470;
    const dots = d.images.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}
      <div class="carou" data-carou>
        <div class="carou-row">
          <button class="carou-btn" data-prev aria-label="Предыдущий слайд">‹</button>
          <div class="carou-stage" style="--ch:${h}px">
            <img src="${d.images[0]}" alt="${esc(d.title||'')}" data-list="${d.images.join(',')}">
          </div>
          <button class="carou-btn" data-next aria-label="Следующий слайд">›</button>
        </div>
        <div class="carou-nav">
          <div class="carou-dots">${dots}</div>
          <div class="carou-count">1 / ${d.images.length}</div>
        </div>
      </div>${note(d)}</div>`;
  },
  screens(d){
    const h = d.shotH || 360;
    const line = d.statline ? `<div class="statline">${d.statline.map(s=>`<div class="c"><div class="n">${md(s.n)}</div><div class="l">${md(s.l)}</div></div>`).join('')}</div>` : '';
    const shots = d.shots.map(s=>shotHTML(s,h)).join('');
    return `<div class="inner">${eyebrow(d)}${title(d)}${line}
      <div class="shots k${d.shots.length}">${shots}</div>${note(d)}</div>`;
  },
  final(d){
    const steps = d.steps.map((t,i)=>`<div class="fs"><div class="fn">${i+1}</div><div class="ft">${md(t)}</div></div>`).join('');
    const terms = d.terms.map(t=>`<span>${md(t)}</span>`).join('');
    return `<div class="inner">${eyebrow(d)}<h1>${md(d.title)}</h1>
      <div class="final-steps">${steps}</div>
      <div class="cta">${md(d.button)}</div>
      <div class="terms">${terms}</div></div>`;
  }
};

/* статичный декоративный фон для «геройских» слайдов */
const FXBG = '<div class="fxbg" aria-hidden="true">'
  + '<div class="base"></div><div class="grid"></div>'
  + '<div class="emblem"></div><div class="emblem two"></div>'
  + '<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>'
  + '<div class="ln a"></div><div class="ln b"></div><div class="ln c"></div>'
  + '</div>';

const canvas = document.getElementById('canvas');
canvas.innerHTML = SLIDES.map(d=>{
  const cls = ['slide'];
  if(d.type==='title' || d.type==='final' || d.center) cls.push('center');
  if(d.hero) cls.push('fx', d.hero);
  else if(d.type==='title' || d.type==='final') cls.push('glow');
  const giant = d.giant ? `<div class="giantnum">${esc(d.giant)}</div>` : '';
  return `<section class="${cls.join(' ')}" data-id="${d.id}">${d.hero?FXBG:''}${giant}${RENDER[d.type](d)}</section>`;
}).join('');

const slides = [...canvas.querySelectorAll('.slide')];

/* плейсхолдер вместо отсутствующего скриншота */
canvas.querySelectorAll('.shot img').forEach(img=>{
  img.addEventListener('error',()=>{
    const f = img.dataset.file;
    const h = img.closest('.shot').style.getPropertyValue('--sh') || '360px';
    img.outerHTML = `<div class="ph" style="--sh:${h}">
      <div class="pi">🖼</div><div class="pf">${esc(f)}</div><div class="pt">файл ещё не положен в /vsl-slides/screens/</div></div>`;
  });
});

/* ============================================================
   ПОДГОНКА: масштаб канваса + контроль переполнения слайда
   ============================================================ */
const H = 1080;
const frame = document.getElementById('frame');
function fitFrame(){
  /* в режиме кадра масштабируем всю раскладку 1920×1080,
     в режиме «только слайд» — один канвас 1280×1080 */
  const w = document.body.classList.contains('solo') ? 1280 : 1920;
  const s = Math.min(window.innerWidth / w, window.innerHeight / H);
  frame.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitFrame);
window.addEventListener('orientationchange', fitFrame);
if(window.ResizeObserver) new ResizeObserver(fitFrame).observe(document.documentElement);
fitFrame();

/* крупные цифры не должны вылезать из колонки */
function fitNumbers(){
  canvas.querySelectorAll('.stats .n, .statline .n, .compare .big').forEach(el=>{
    el.style.fontSize = '';
    const box = el.parentElement, cs = getComputedStyle(box);
    const room = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 0;
    while(el.scrollWidth > room && size > 40 && guard++ < 60){
      size -= 4;
      el.style.fontSize = size + 'px';
    }
  });
}

/* рамка скриншота подгоняется под пропорцию картинки: по ширине — под колонку,
   по высоте — под shotH; что меньше, то и ограничивает */
function fitShots(){
  canvas.querySelectorAll('.shots').forEach(row=>{
    const cols = getComputedStyle(row).gridTemplateColumns.split(' ').map(parseFloat);
    [...row.children].forEach((shot,i)=>{
      const img = shot.querySelector('img');
      if(!img || !img.naturalWidth) return;
      const cs = getComputedStyle(shot);
      const chrome = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
                   + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
      const maxW = (cols[i] || cols[0]) - chrome;
      const maxH = parseFloat(cs.getPropertyValue('--sh')) || 360;
      const k = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      img.style.width = w + 'px';
      img.style.height = h + 'px';
      shot.style.width = (w + chrome) + 'px';
    });
  });
}

/* страховка: если контент всё же выше безопасной зоны — мягко ужимаем (не ниже .9) */
const overflow = new Set();
function fitSlides(){
  slides.forEach((sl,i)=>{
    const inner = sl.querySelector('.inner');
    inner.style.transform = '';
    const avail = H - 72*2 - 90;          /* безопасная высота: 846px */
    const need  = inner.scrollHeight;
    if(need > avail){
      const k = Math.max(.9, avail / need);
      inner.style.transform = `scale(${k})`;
      if(need / avail > 1.11) overflow.add(i+1);
      console.warn(`[vsl-slides] слайд ${i+1}: контент ${Math.round(need)}px > ${avail}px, ужат до ${k.toFixed(3)}`);
    }
  });
}
function measure(){
  slides.forEach(s=>s.style.visibility='visible');
  fitNumbers(); fitShots(); fitSlides();
  slides.forEach(s=>s.style.visibility='');
}
let mTimer = null;
const remeasure = () => { clearTimeout(mTimer); mTimer = setTimeout(measure, 60); };
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(measure); } else { window.addEventListener('load', measure); }
window.addEventListener('load', measure);
/* картинки грузятся асинхронно — пересчитываем, когда станут известны их размеры */
canvas.querySelectorAll('.shot img, .carou-stage img').forEach(img=>img.addEventListener('load', remeasure));

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
const total = slides.length;
let cur = 0;
const cNow = document.getElementById('cNow'), cTot = document.getElementById('cTot');
const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
const cueBlock = document.getElementById('cueBlock'), cueText = document.getElementById('cueText'),
      cueNum = document.getElementById('cueNum'), cueWarn = document.getElementById('cueWarn');
cTot.textContent = String(total).padStart(2,'0');

function render(){
  slides.forEach((s,i)=>s.classList.toggle('active', i===cur));
  cNow.textContent = String(cur+1).padStart(2,'0');
  prevBtn.disabled = cur===0; nextBtn.disabled = cur===total-1;
  const d = SLIDES[cur];
  cueBlock.textContent = d.block || '';
  cueText.textContent  = d.cue ? '«'+d.cue+'»' : '';
  cueNum.textContent   = 'слайд ' + (cur+1) + ' / ' + total;
  cueWarn.textContent  = overflow.has(cur+1) ? '⚠ переполнение' : '';
  if(location.hash !== '#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
}
function go(i){
  i = Math.max(0, Math.min(total-1, i));
  if(i===cur) return;
  zClose();
  cur = i; render();
}
const next = ()=>go(cur+1), prev = ()=>go(cur-1);

nextBtn.addEventListener('click', e=>{e.stopPropagation(); next();});
prevBtn.addEventListener('click', e=>{e.stopPropagation(); prev();});

/* карусель: стрелки, точки, счётчик */
canvas.querySelectorAll('[data-carou]').forEach(c=>{
  const img = c.querySelector('.carou-stage img');
  const list = (img.dataset.list || '').split(',').filter(Boolean);
  const dots = [...c.querySelectorAll('.carou-dots i')];
  const cnt = c.querySelector('.carou-count');
  let idx = 0;
  function set(i){
    idx = (i + list.length) % list.length;
    img.setAttribute('src', list[idx]);
    dots.forEach((d,k)=>d.classList.toggle('on', k===idx));
    cnt.textContent = (idx+1) + ' / ' + list.length;
  }
  c.querySelector('[data-next]').addEventListener('click', e=>{e.stopPropagation(); set(idx+1);});
  c.querySelector('[data-prev]').addEventListener('click', e=>{e.stopPropagation(); set(idx-1);});
  dots.forEach((d,k)=>d.addEventListener('click', e=>{e.stopPropagation(); set(k);}));
  /* предзагрузка, чтобы листалось без морганий */
  list.slice(1).forEach(src=>{ const p = new Image(); p.src = src; });
});

/* лупа: наведение показывает скриншот крупно, клик закрепляет */
const zv = document.getElementById('zoomView'), zi = document.getElementById('zoomImg'), zh = document.getElementById('zoomHint');
let zPinned = false;
function zShow(src){ if(zi.getAttribute('src') !== src) zi.setAttribute('src', src); zv.classList.add('on'); }
function zHide(){ if(!zPinned) zv.classList.remove('on'); }
function zClose(){ zPinned = false; zv.classList.remove('on','pinned'); zh.textContent = 'клик — закрепить'; }
canvas.addEventListener('mouseover', e=>{
  const im = e.target.closest && e.target.closest('.shot img, .carou-stage img');
  if(im && !zPinned) zShow(im.getAttribute('src'));
});
canvas.addEventListener('mouseout', e=>{ if(e.target.closest && e.target.closest('.shot img, .carou-stage img')) zHide(); });
canvas.addEventListener('click', e=>{
  const im = e.target.closest && e.target.closest('.shot img, .carou-stage img');
  if(im){ e.stopPropagation(); zShow(im.getAttribute('src')); zPinned = true; zv.classList.add('pinned'); zh.textContent = 'клик — закрыть'; }
}, true);
zv.addEventListener('click', e=>{ e.stopPropagation(); zClose(); });

/* клик по половинам экрана листает, но не мешает выделять текст:
   если тянули мышью или что-то выделено — это не листание */
let downX = 0, downY = 0;
document.addEventListener('mousedown', e=>{ downX = e.clientX; downY = e.clientY; });
document.addEventListener('click', e=>{
  const t = e.target instanceof Element ? e.target : null;
  if(t && (t.closest('.chrome') || t.closest('.cuebar'))) return;
  if(Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) return;
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed) return;
  (e.clientX > window.innerWidth / 2 ? next : prev)();
});

/* режимы */
function toggleUI(){ document.body.classList.toggle('ui'); }
function toggleCue(){ document.body.classList.toggle('cue'); }
/* кадр 1920×1080 с местом под эксперта ⟷ только презентация 1280×1080 */
function toggleSolo(){ document.body.classList.toggle('solo'); fitFrame(); }
function toggleFs(){
  const r = document.documentElement;
  if(!document.fullscreenElement){ (r.requestFullscreen||r.webkitRequestFullscreen).call(r); }
  else{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
}

/* ввод номера слайда */
const gotoBox = document.getElementById('gotoBox');
let buf = '', bufTimer = null;
function showBuf(){
  gotoBox.textContent = buf || '';
  document.body.classList.toggle('goto-on', !!buf);
  clearTimeout(bufTimer);
  if(buf) bufTimer = setTimeout(clearBuf, 2500);
}
function clearBuf(){ buf=''; showBuf(); }

window.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(/^[0-9]$/.test(k)){ e.preventDefault(); buf = (buf+k).slice(0,2); showBuf(); return; }
  if(k==='Enter'){ e.preventDefault(); if(buf){ go(parseInt(buf,10)-1); clearBuf(); } return; }
  if(k==='Backspace'){ e.preventDefault(); buf = buf.slice(0,-1); showBuf(); return; }
  if(k==='Escape'){ clearBuf(); zClose(); return; }
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='ArrowDown'){ e.preventDefault(); next(); return; }
  if(k==='ArrowLeft'||k==='PageUp'||k==='ArrowUp'){ e.preventDefault(); prev(); return; }
  if(k==='Home'){ e.preventDefault(); go(0); return; }
  if(k==='End'){ e.preventDefault(); go(total-1); return; }
  const c = k.toLowerCase();
  if(c==='h'||c==='р'){ e.preventDefault(); toggleUI(); return; }   /* служебное */
  if(c==='p'||c==='з'){ e.preventDefault(); toggleCue(); return; }  /* монтажёр */
  if(c==='v'||c==='м'){ e.preventDefault(); toggleSolo(); return; } /* кадр / только слайд */
  if(c==='f'||c==='а'){ e.preventDefault(); toggleFs(); return; }   /* фулскрин */
});

/* свайп */
let tx=0, ty=0;
window.addEventListener('touchstart', e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; }, {passive:true});
window.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) dx<0 ? next() : prev();
}, {passive:true});

/* старт: режим записи включён, служебного нет */
const m = location.hash.match(/#(\d+)/);
if(m) cur = Math.max(0, Math.min(total-1, parseInt(m[1],10)-1));
render();
</script>
</body>
</html>
